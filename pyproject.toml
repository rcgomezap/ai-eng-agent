[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-eng-agent"
version = "0.1.0"
description = "Cyclic LangGraph hotel agent with persistent memory"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "injector>=0.22,<1",
    "langchain>=1.3.16",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "langgraph-prebuilt>=1.1.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.1,<2",
    "typer>=0.16,<1",
]

[project.scripts]
hotel-agent = "main:app"

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.uv]
package = true

[tool.setuptools]
py-modules = ["configuration", "graph", "hotel_client", "interfaces", "main", "schemas"]

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
